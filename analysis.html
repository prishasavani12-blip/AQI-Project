<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AQI Analysis</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header>
        <h1>🌿 AQI Project</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/analysis">Analysis</a>
            <a href="/about">About</a>
        </nav>
    </header>


    <main>

        <h2>AQI Analysis</h2>

        <p class="analysis-description">
            Simple graphical analysis of Air Quality Index values.
        </p>


        <!-- AQI Graph Card -->
        <section class="analysis-card">

            <h3>AQI Trend Graph</h3>

            <div class="chart-container">
                <canvas id="aqiChart"></canvas>
            </div>

        </section>


        <!-- Information Card -->
        <section class="analysis-info">

            <h3>About the Graph</h3>

            <p>
                This graph shows AQI values from the air quality dataset.
                Higher AQI values indicate poorer air quality.
            </p>

        </section>

    </main>


    <footer>
        Air Quality Index Project | Python & Flask
    </footer>


    <script>

        const dates = {{ dates | tojson }};
        const aqiValues = {{ aqi_values | tojson }};


        const ctx = document.getElementById("aqiChart");


        new Chart(ctx, {

            type: "line",

            data: {

                labels: dates,

                datasets: [{
                    label: "AQI",
                    data: aqiValues,

                    borderWidth: 3,

                    tension: 0.3,

                    fill: false,

                    pointRadius: 4,

                    pointHoverRadius: 6
                }]

            },


            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    title: {
                        display: true,
                        text: "AQI Values"
                    },

                    legend: {
                        display: true
                    }

                },


                scales: {

                    x: {

                        title: {
                            display: true,
                            text: "Date"
                        }

                    },


                    y: {

                        title: {
                            display: true,
                            text: "AQI"
                        },

                        beginAtZero: true

                    }

                }

            }

        });

    </script>

</body>

</html>
